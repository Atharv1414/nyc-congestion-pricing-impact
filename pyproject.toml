[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-congestion-pricing-impact"
version = "1.0.0"
description = "Causal analysis of New York's congestion charge on 128 million real taxi trips"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Atharv Patil" }]
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "scipy>=1.11", "pyarrow>=15",
                "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "hypothesis>=6.100", "statsmodels>=0.14"]

[project.scripts]
congestion-impact = "congestion_impact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
